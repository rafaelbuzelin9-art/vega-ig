<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="saida.css">
<style>
  /* Geist: a fonte do site deles. Se o pacote nao estiver instalado, o
     fallback e a stack do proprio Tailwind (ui-sans-serif). */
  @font-face{font-family:Geist;font-weight:100 900;font-display:block;
    src:url("node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2") format("woff2")}
  html{font-family:Geist,ui-sans-serif,system-ui,sans-serif}
  body{margin:0;padding:40px;width:1000px}
</style></head>
<body>
<!-- markup COPIADO de registry/new-york-v4/blocks/dashboard-01/components/
     section-cards.tsx, com os componentes Card* expandidos para as classes
     que eles aplicam em card.tsx. Conteudo original preservado. -->
<div class="grid grid-cols-1 gap-4 *:data-[slot=card]:bg-gradient-to-t *:data-[slot=card]:from-primary/5 *:data-[slot=card]:to-card *:data-[slot=card]:shadow-xs @xl/main:grid-cols-2 dark:*:data-[slot=card]:bg-card">
  <div data-slot="card" class="@container/card flex flex-col gap-6 rounded-xl border bg-card py-6 text-card-foreground shadow-sm">
    <div data-slot="card-header" class="@container/card-header grid auto-rows-min grid-rows-[auto_auto] items-start gap-2 px-6 has-data-[slot=card-action]:grid-cols-[1fr_auto]">
      <div data-slot="card-description" class="text-sm text-muted-foreground">Total Revenue</div>
      <div data-slot="card-title" class="leading-none font-semibold text-2xl tabular-nums @[250px]/card:text-3xl">$1,250.00</div>
      <div data-slot="card-action" class="col-start-2 row-span-2 row-start-1 self-start justify-self-end">
        <span data-slot="badge" class="inline-flex items-center justify-center rounded-md border px-2 py-0.5 text-xs font-medium w-fit whitespace-nowrap shrink-0 gap-1 text-foreground">
          <svg class="size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
          +12.5%
        </span>
      </div>
    </div>
    <div data-slot="card-footer" class="flex items-center px-6 flex-col items-start gap-1.5 text-sm">
      <div class="line-clamp-1 flex gap-2 font-medium">Trending up this month
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
      </div>
      <div class="text-muted-foreground">Visitors for the last 6 months</div>
    </div>
  </div>
</div>
</body></html>
