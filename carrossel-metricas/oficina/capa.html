<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:Jost;src:url('fonts/jost-variable-latin.woff2')format('woff2');font-weight:100 900;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#111}
:root{--creme:#F2EAD9;--preto:#050505;--sepia:#9C8F7D;--fio:rgba(110,98,83,.30)}
.peca{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--preto)}

/* grade de pontos 38px do campo VEGA */
.grade{position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(156,143,125,.30) 1.3px,transparent 1.4px);
  background-size:38px 38px;background-position:19px 19px}

/* heroi: entra em lighten pra grade sobreviver no preto */
.heroi{position:absolute;left:0;top:76px;width:1080px;
  mix-blend-mode:lighten;display:block}

.marca{position:absolute;left:78px;top:70px;height:34px}

.bloco{position:absolute;left:78px;right:78px;top:176px;text-align:center}
h1{font:200 80px/1.14 Jost;letter-spacing:-.025em;word-spacing:-.10em;color:var(--creme);
  text-shadow:0 0 38px rgba(242,234,217,.22)}
h1 b{font-weight:500}
.reta{margin-top:26px;font:300 38px/1.3 Jost;letter-spacing:.01em;color:var(--sepia)}

.arco{position:absolute;inset:0}
.arco text{font:300 31px Jost;letter-spacing:.02em;fill:var(--sepia)}
</style></head><body>
<div class="peca">
  <div class="grade"></div>
  <img class="heroi" id="heroi" src="" alt="">
  <img class="marca" src="assets/vega-lockup-creme.svg" alt="">

  <div class="bloco">
    <h1>Você sabe o que significam<br>as métricas dos<br>seus <b>anúncios?</b></h1>
    <div class="reta">Vou te mostrar algumas delas</div>
  </div>

  <svg class="arco" viewBox="0 0 1080 1350">
    <defs><path id="a" fill="none" d="M 150 649.0 Q 540.0 742.5 930 648.9"/></defs>
    <text><textPath href="#a" startOffset="50%" text-anchor="middle">Com elas, entende melhor onde investiu seu dinheiro</textPath></text>
  </svg>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const h = p.get('h');
  const el = document.getElementById('heroi');
  if (h) { el.src = 'assets/' + h + '.png'; } else { el.remove(); }
  const arcY = p.get('arc');
  const arcoEl = document.querySelector('.arco');
  if (arcY === 'off') { arcoEl.remove(); }
  else if (arcY && arcY.split(',').length === 6) {
    const v = arcY.split(',').map(Number);
    document.getElementById('a').setAttribute('d',
      `M ${v[0]} ${v[1]} Q ${v[2]} ${v[3]} ${v[4]} ${v[5]}`);
  } else if (arcY) {
    document.getElementById('a').setAttribute('d',
      `M 190 ${arcY} A 720 720 0 0 1 890 ${arcY}`);
  }
</script>
</body></html>
