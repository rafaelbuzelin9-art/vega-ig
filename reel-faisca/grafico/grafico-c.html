<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Grafico vendas C: contador grande</title>
<style>
  :root{ --bg:#141416; --card:#1b1b1e; --line:#2a2a2f; --txt:#e8e8ec; --mut:#8a8a94; --green:#2fd07a; }
  html,body{margin:0;background:var(--bg);width:1600px;height:1000px;overflow:hidden;
    font-family:"Helvetica Neue",-apple-system,Helvetica,Arial,sans-serif;color:var(--txt)}
  #palco{position:relative;width:1600px;height:1000px}
  .card{position:absolute;left:80px;top:80px;width:1440px;height:840px;background:var(--card);
    border:2px solid var(--line);border-radius:28px}
  .rotulo{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:36px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--mut);font-weight:500}
  .num{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:400px;font-weight:700;
    letter-spacing:-.04em;line-height:1;color:var(--txt);font-variant-numeric:tabular-nums}
  .num small{font-size:200px;font-weight:600;color:var(--green)}
  .sub{position:absolute;left:0;right:0;top:690px;text-align:center;font-size:40px;color:var(--mut)}
  .selo{position:absolute;left:50%;top:752px;transform:translateX(-50%);padding:14px 40px;border-radius:999px;
    background:rgba(47,208,122,.14);color:var(--green);font-size:44px;font-weight:600;letter-spacing:.02em;opacity:0}
  .selo b{font-weight:700}
  .barra{position:absolute;left:150px;right:150px;top:846px;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
  .barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1fa85f,#39e68b);border-radius:5px}
  .pontos{position:absolute;left:150px;right:150px;top:866px;display:flex;justify-content:space-between;font-size:30px;color:var(--mut);letter-spacing:.06em}
</style>
</head>
<body>
<div id="palco">
  <div class="card"></div>
  <div class="rotulo">Vendas pelo WhatsApp</div>
  <div class="num"><span id="n">1,0</span><small>x</small></div>
  <div class="sub">em relação a julho</div>
  <div class="selo" id="selo">setembro &nbsp;<b>+200%</b></div>
  <div class="barra"><i id="prog"></i></div>
  <div class="pontos"><span>jul</span><span>ago</span><span>set</span></div>
</div>
<script>
  const easeOut = t => 1 - Math.pow(1 - Math.min(Math.max(t,0),1), 3);
  const back = t => { t=Math.min(Math.max(t,0),1); const c=1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
  const fmt = x => x.toFixed(1).replace('.',',');
  window.frame = function(t){
    const pA = easeOut((t-0.4)/1.2);
    const pS = back((t-1.6)/1.6);
    const ago = 1.0 + 0.9*pA;
    const set = t<1.6 ? 1.0 : 1.0 + 2.0*pS;
    let v = t<0.4 ? 1.0 : t<1.6 ? ago : Math.max(ago,set);
    if (t>=3.2) v = 3.0;
    v = Math.min(v, 3.0);
    document.getElementById('n').textContent = fmt(v);
    const numEl = document.querySelector('.num');
    numEl.style.color = v>=2.95 ? '#2fd07a' : '#e8e8ec';
    const resp = t>=3.2 ? 1 + 0.015*Math.sin((t-3.2)*2*Math.PI/1.2) : (t>=1.6 && t<3.2 ? 1 + 0.05*Math.sin(Math.PI*Math.min((t-1.6)/1.6,1)) : 1);
    numEl.style.transform='scale('+resp+')'; numEl.style.transformOrigin='center';
    const prog = t<0.4 ? 0 : t<1.6 ? 0.5*easeOut((t-0.4)/1.2) : 0.5 + 0.5*Math.min(Math.max((t-1.6)/1.6,0),1);
    document.getElementById('prog').style.width = (prog*100)+'%';
    const selo = document.getElementById('selo');
    const s = easeOut((t-3.1)/0.5);
    selo.style.opacity = s; selo.style.transform = 'translateX(-50%) translateY('+(20*(1-s))+'px)';
  };
  window.frame(0);
  if (!location.search.includes('parado')) {
    const t0 = performance.now();
    (function tick(){ window.frame(((performance.now()-t0)/1000)%5.5); requestAnimationFrame(tick); })();
  }
</script>
</body>
</html>
