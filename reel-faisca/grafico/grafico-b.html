<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Grafico vendas B: linha</title>
<style>
  :root{ --bg:#141416; --card:#1b1b1e; --line:#2a2a2f; --txt:#e8e8ec; --mut:#8a8a94; --green:#2fd07a; }
  html,body{margin:0;background:var(--bg);width:1600px;height:1000px;overflow:hidden;
    font-family:"Helvetica Neue",-apple-system,Helvetica,Arial,sans-serif;color:var(--txt)}
  #palco{position:relative;width:1600px;height:1000px}
  .card{position:absolute;left:80px;top:80px;width:1440px;height:840px;background:var(--card);
    border:2px solid var(--line);border-radius:28px}
  .rotulo{position:absolute;left:150px;top:140px;font-size:34px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--mut);font-weight:500}
  .sub{position:absolute;left:150px;top:196px;font-size:40px;color:var(--txt)}
  .contador{position:absolute;right:150px;top:120px;font-size:200px;font-weight:700;
    letter-spacing:-.03em;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
  .contador small{font-size:110px;font-weight:600;margin-left:6px}
  .legenda{position:absolute;right:160px;top:330px;font-size:34px;color:var(--mut)}
  svg{position:absolute;left:0;top:0}
  .mes{position:absolute;bottom:130px;width:200px;text-align:center;font-size:40px;color:var(--mut);letter-spacing:.06em}
  .val{position:absolute;width:200px;text-align:center;font-size:48px;font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="palco">
  <div class="card"></div>
  <div class="rotulo">Vendas pelo WhatsApp</div>
  <div class="sub">Julho a setembro</div>
  <div class="contador"><span id="num">1,0</span><small>x</small></div>
  <div class="legenda">em relação a julho</div>

  <svg width="1600" height="1000" viewBox="0 0 1600 1000">
    <defs>
      <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2fd07a" stop-opacity=".45"/>
        <stop offset="1" stop-color="#2fd07a" stop-opacity="0"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="10" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g stroke="#2a2a2f" stroke-width="2">
      <line x1="150" x2="1450" y1="800" y2="800"/>
      <line x1="150" x2="1450" y1="670" y2="670" opacity=".5"/>
      <line x1="150" x2="1450" y1="540" y2="540" opacity=".5"/>
      <line x1="150" x2="1450" y1="410" y2="410" opacity=".5"/>
    </g>
    <defs>
      <linearGradient id="traco" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1fa85f"/>
        <stop offset="1" stop-color="#4dff9f"/>
      </linearGradient>
      <clipPath id="corte"><rect id="corteR" x="150" y="0" width="0" height="1000"/></clipPath>
      <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="14"/>
      </filter>
    </defs>
    <g clip-path="url(#corte)">
      <path id="areaP" fill="url(#area)" d=""/>
      <path id="sombra" fill="none" stroke="#2fd07a" stroke-width="30" stroke-opacity=".25" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" d=""/>
      <path id="linha" fill="none" stroke="url(#traco)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d=""/>
    </g>
    <circle id="p1" r="14" fill="#1b1b1e" stroke="#2fd07a" stroke-width="8"/>
    <circle id="p2" r="14" fill="#1b1b1e" stroke="#2fd07a" stroke-width="8"/>
    <circle id="haloP" r="34" fill="#2fd07a" opacity=".55" filter="url(#halo)"/>
    <circle id="p3" r="18" fill="#4dff9f" stroke="#1b1b1e" stroke-width="6"/>
  </svg>

  <div id="v1" class="val" style="left:260px">1x</div>
  <div id="v2" class="val" style="left:700px"></div>
  <div id="v3" class="val" style="left:1140px"></div>
  <div class="mes" style="left:260px">jul</div>
  <div class="mes" style="left:700px">ago</div>
  <div class="mes" style="left:1140px">set</div>
</div>
<script>
  const UM = 130, BASE = 800;
  const X = [360, 800, 1240];
  const easeOut = t => 1 - Math.pow(1 - Math.min(Math.max(t,0),1), 3);
  const back = t => { t=Math.min(Math.max(t,0),1); const c=1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
  const fmt = x => x.toFixed(1).replace('.',',');
  const y = m => BASE - m*UM;

  // Curva suave fixa por jul (1x), ago (1,9x), set (3x), com tangentes horizontais
  // nos pontos: a curva "assenta" em cada mês e acelera para o próximo.
  const P = [[X[0],y(1)], [X[1],y(1.9)], [X[2],y(3)]];
  function curva(){
    let d = 'M'+P[0][0]+' '+P[0][1];
    for (let i=0;i<P.length-1;i++){
      const a=P[i], b=P[i+1], k=(b[0]-a[0])*0.5;
      d += ' C'+(a[0]+k)+' '+a[1]+' '+(b[0]-k)+' '+b[1]+' '+b[0]+' '+b[1];
    }
    return d;
  }
  const D = curva();
  const linha = document.getElementById('linha'), sombra = document.getElementById('sombra');
  linha.setAttribute('d', D); sombra.setAttribute('d', D);
  document.getElementById('areaP').setAttribute('d', D + ' L'+X[2]+' '+BASE+' L'+X[0]+' '+BASE+' Z');
  const L = linha.getTotalLength();
  // comprimento até o ponto de agosto (busca por x)
  let Lago = L/2; for (let s=0;s<=L;s+=2){ if (linha.getPointAtLength(s).x >= X[1]) { Lago = s; break; } }

  // A linha é revelada da esquerda para a direita: 0,4-1,6 jul→ago; 1,6-3,2 ago→set.
  window.frame = function(t){
    let len;
    if (t < 0.4) len = 0;
    else if (t < 1.6) len = Lago * easeOut((t-0.4)/1.2);
    else len = Lago + (L-Lago) * easeOut((t-1.6)/1.6);
    len = Math.min(Math.max(len,0), L);
    const cab = linha.getPointAtLength(len);
    document.getElementById('corteR').setAttribute('width', Math.max(0, cab.x - 150 + 2));
    const ago = 1.9, set = (BASE - cab.y)/UM;
    const c1=document.getElementById('p1'), c2=document.getElementById('p2'), c3=document.getElementById('p3'), h=document.getElementById('haloP');
    c1.setAttribute('cx',X[0]); c1.setAttribute('cy',y(1));
    c2.setAttribute('cx',X[1]); c2.setAttribute('cy',y(1.9)); c2.style.opacity = t>=1.5?1:0;
    c3.setAttribute('cx',cab.x); c3.setAttribute('cy',cab.y); c3.style.opacity = t>=0.4?1:0;
    h.setAttribute('cx',cab.x); h.setAttribute('cy',cab.y); h.style.opacity = t>=0.4 ? (t>=3.2 ? .45+.2*Math.sin((t-3.2)*2*Math.PI/1.2) : .55) : 0;
    c3.setAttribute('r', t>=3.2 ? 18 + 3*Math.sin((t-3.2)*2*Math.PI/1.2) : 18);
    const v2=document.getElementById('v2'), v3=document.getElementById('v3');
    v2.textContent='1,9x'; v2.style.bottom=(1000-y(1.9)+30)+'px'; v2.style.opacity=t>=1.5?1:0;
    // Sem "3x" no ponto de setembro: o contador já diz 3,0x e o rótulo batia na legenda.
    v3.textContent=''; v3.style.opacity=0;
    document.getElementById('v1').style.bottom=(1000-y(1)+30)+'px';
    // O contador lê a altura da cabeça da linha, então número e curva nunca divergem.
    let contador = t<0.4 ? 1.0 : set;
    if (t>=3.2) contador = 3.0;
    document.getElementById('num').textContent = fmt(Math.min(contador,3.0));
    const c = document.querySelector('.contador');
    const resp = t>=3.2 ? 1 + 0.015*Math.sin((t-3.2)*2*Math.PI/1.2) : (t>=1.6 && t<3.2 ? 1 + 0.06*Math.sin(Math.PI*Math.min((t-1.6)/1.6,1)) : 1);
    c.style.transform='scale('+resp+')'; c.style.transformOrigin='right top';
  };
  window.frame(0);
  if (!location.search.includes('parado')) {
    const t0 = performance.now();
    (function tick(){ window.frame(((performance.now()-t0)/1000)%5.5); requestAnimationFrame(tick); })();
  }
</script>
</body>
</html>
