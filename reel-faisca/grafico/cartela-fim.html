<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartela final: logo VEGA sobre a rua acesa</title>
<style>
  html,body{margin:0;background:#000;width:480px;height:854px;overflow:hidden}
  #palco{position:relative;width:480px;height:854px;background:#000;overflow:hidden}
  #rua{position:absolute;inset:0;width:480px;height:854px;object-fit:cover}
  #veu{position:absolute;inset:0;background:#050505;opacity:0}
  #logo{position:absolute;left:70px;width:340px;top:362px;opacity:0}
</style>
</head>
<body>
<div id="palco">
  <img id="rua" src="../comp/rua-fim.png">
  <div id="veu"></div>
  <!-- logo v5 (lira creme) da skill vega-fontes -->
  <img id="logo" src="file:///Users/buzelaa_/.claude/skills/vega-fontes/logo-vega.svg">
</div>
<script>
  const easeOut=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
  // 0-0,3 rua pura; véu até 0,55 em 0,3-1,0; logo entra em 0,6-1,2 e segura.
  window.frame=function(t){
    document.getElementById('veu').style.opacity = 0.55*easeOut((t-0.3)/0.7);
    const l=document.getElementById('logo'); const a=easeOut((t-0.6)/0.6);
    l.style.opacity=a; l.style.transform='translateY('+(10*(1-a))+'px)';
  };
  window.frame(0);
</script>
</body>
</html>
