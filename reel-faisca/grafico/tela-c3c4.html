<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tela do celular C3 + C4</title>
<style>
  html,body{margin:0;background:transparent;width:480px;height:854px;overflow:hidden;
    font-family:"Helvetica Neue",-apple-system,Helvetica,Arial,sans-serif}
  #palco{position:relative;width:480px;height:854px;background:transparent}
  /* Tela plana 390x800 deformada para o quadrilátero medido no take. Opaca: preto + conteúdo. */
  #tela{position:absolute;left:0;top:0;width:390px;height:800px;transform-origin:0 0;overflow:hidden;background:#050806;opacity:0;border-radius:46px}
  .fase{position:absolute;inset:0;opacity:0}
  .bolha{position:absolute;height:50px;border-radius:25px;background:#4ee97f;box-shadow:0 0 18px rgba(78,233,127,.5)}
  .bolha.esq{left:30px}
  .bolha.dir{right:30px;background:#35d873}
  #flash{position:absolute;inset:0;background:#4ee97f;opacity:0}
  #conserto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
  #engr{width:170px;height:170px}
  #barra{width:260px;height:16px;border-radius:8px;background:#3a2a1e;overflow:hidden}
  #barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a3d,#ffd36b);border-radius:8px;box-shadow:0 0 14px #ff9a4a}
  #txt{font-size:44px;letter-spacing:.04em;color:#ffd9b8;font-weight:500}
  #ok{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
  #circ{width:220px;height:220px;border-radius:50%;background:#4ee97f;box-shadow:0 0 40px rgba(78,233,127,.8);
    display:flex;align-items:center;justify-content:center;transform:scale(0)}
  #ok span{font-size:46px;letter-spacing:.06em;color:#bfffd3;font-weight:500;opacity:0}
</style>
</head>
<body>
<div id="palco">
  <div id="tela">
    <div id="chat" class="fase"><div id="flash"></div></div>
    <div id="conserto" class="fase">
      <svg id="engr" viewBox="0 0 100 100"><g fill="#ffb366" stroke="#ff7a1a" stroke-width="2">
        <path d="M50 8l7 0 2 9 8 3 8-5 5 5-5 8 3 8 9 2 0 7-9 2-3 8 5 8-5 5-8-5-8 3-2 9-7 0-2-9-8-3-8 5-5-5 5-8-3-8-9-2 0-7 9-2 3-8-5-8 5-5 8 5 8-3z"/>
        <circle cx="50" cy="50" r="14" fill="#050806"/></g></svg>
      <div id="barra"><i></i></div>
      <div id="txt">resolvendo…</div>
    </div>
    <div id="ok" class="fase">
      <div id="circ"><svg width="130" height="130" viewBox="0 0 100 100"><path d="M20 52l20 20 40-44" fill="none" stroke="#063" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span>resolvido</span>
    </div>
  </div>
</div>
<script>
  // carrega o rastreio da cena pedida (se o arquivo não existir, a tela fica fixa)
  document.write('<script src="quads-' + (new URLSearchParams(location.search).get('cena') || 'c4') + '.js"><\/script>');
</script>
<script>
  const P = new URLSearchParams(location.search);
  const CENA = P.get('cena') || 'c4';
  // Quadriláteros medidos (480x854): TL, TR, BR, BL.
  // Cantos lidos nas ampliações 6x (C4 pela borda laranja de 4,3s; C3 pela tela de 4,6s), encolhidos 1% para o centro.
  // c4s = sequel da C3 (01/out à noite): celular parado, mesma posição da C4 v2.
  const BRUTO = { c3: [[84,412],[200,368],[383,552],[232,610]], c4: [[77,410],[204,367],[387,551],[238,614]], c4s: [[77,410],[204,367],[387,551],[238,614]] };
  const ESCALA = { c3: 0.985, c4: 1.0, c4s: 1.0 };
  // Linha do tempo por cena (em T): fim dos balões, conserto, resolvido (null = não tem).
  const FASES = { c3:  {chatFim:6.05, cons:[6.05,8.4],  ok:[9.05,10.2]},
                  c4:  {chatFim:6.05, cons:[6.05,8.4],  ok:[9.05,10.2]},
                  c4s: {chatFim:6.05, cons:[6.05,6.05], ok:null} }; // c4s: só balões; sem "resolvendo"
  const QUAD = {};
  for (const k in BRUTO){ const cx=BRUTO[k].reduce((s,p)=>s+p[0],0)/4, cy=BRUTO[k].reduce((s,p)=>s+p[1],0)/4;
    QUAD[k] = BRUTO[k].map(([x,y])=>[cx+(x-cx)*ESCALA[k], cy+(y-cy)*ESCALA[k]]); }
  // Linha do tempo única T (segundos desde o celular acender na C3).
  // C3: celular acende em t=2.25 -> T = t - 2.25 (vai até T=2.75 no fim da C3).
  // C4: começa em T=2.75 -> T = t + 2.75. Mergulho em t=3.3 (T=6.05).
  const T0 = CENA === 'c3' ? -2.25 : 2.75;
  const F = FASES[CENA];
  const SW = 390, SH = 800;
  function homografia(src, dst){
    const A=[], B=[];
    for(let i=0;i<4;i++){ const [x,y]=src[i], [u,v]=dst[i];
      A.push([x,y,1,0,0,0,-u*x,-u*y]); B.push(u);
      A.push([0,0,0,x,y,1,-v*x,-v*y]); B.push(v); }
    const n=8; for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
      [A[c],A[p]]=[A[p],A[c]]; [B[c],B[p]]=[B[p],B[c]];
      for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<n;k++) A[r][k]-=f*A[c][k]; B[r]-=f*B[c]; } }
    const h=B.map((b,i)=>b/A[i][i]); const [a,b,c,d,e,f,g,hh]=h;
    return `matrix3d(${a},${d},0,${g}, ${b},${e},0,${hh}, 0,0,1,0, ${c},${f},0,1)`;
  }
  const tela=document.getElementById('tela');
  const FPS = 24;
  // Rastreio por quadro (quads-<cena>.js, gerado por rastrear.py): se existir, a tela segue o celular.
  function quadEm(t){
    const Qs = window.QUADS;
    if (!Qs || !Qs.length) return QUAD[CENA];
    const i = Math.min(Qs.length-1, Math.max(0, Math.round(t*FPS)));
    const cx=Qs[i].reduce((s,p)=>s+p[0],0)/4, cy=Qs[i].reduce((s,p)=>s+p[1],0)/4;
    return Qs[i].map(([x,y])=>[cx+(x-cx)*ESCALA[CENA], cy+(y-cy)*ESCALA[CENA]]);
  }
  tela.style.transform = homografia([[0,0],[SW,0],[SW,SH],[0,SH]], QUAD[CENA]);

  // Chegadas: primeira em T=0.35, acelerando, até T=6.0 (mergulho).
  const chegadas=[]; let tt=0.35, dt=0.5; let s=7;
  const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
  while(tt<6.0){ chegadas.push({t:tt, w:150+rnd()*140, lado: rnd()<0.6?'esq':'dir'}); tt+=dt; dt=Math.max(0.10, dt*0.88); }
  const chat=document.getElementById('chat');
  const bolhas=chegadas.map(c=>{ const d=document.createElement('div'); d.className='bolha '+c.lado; d.style.width=c.w+'px'; chat.appendChild(d); return d; });
  const easeOut=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
  const easeBack=x=>{x=Math.min(Math.max(x,0),1);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
  const fase=(id,on)=>document.getElementById(id).style.opacity=on?1:0;

  window.frame=function(t){
    const T = t + T0;
    tela.style.transform = homografia([[0,0],[SW,0],[SW,SH],[0,SH]], quadEm(t));
    // tela opaca aparece quando o celular acende (T>=0); some depois do "resolvido"
    const fimTela = F.ok ? F.ok[1] : F.cons[1];
    tela.style.opacity = (T>=0 && T<fimTela) ? 1 : 0;
    // ---- balões: T 0 até o mergulho
    const emChat = T>=0 && T<F.chatFim;
    fase('chat', emChat);
    if(emChat){
      const chegaram=chegadas.filter(c=>c.t<=T).length; let flash=0;
      bolhas.forEach((b,i)=>{
        const c=chegadas[i];
        if(c.t>T){ b.style.opacity=0; return; }
        const idx=chegaram-1-i;
        const entra=easeOut((T-c.t)/0.22);
        const y = SH-80 - idx*64 + (1-entra)*40;
        b.style.opacity = y < -60 ? 0 : entra; b.style.top=y+'px';
        b.style.transform='scale('+(0.6+0.4*entra)+')';
        if(T-c.t<0.18) flash=Math.max(flash, 0.16*(1-(T-c.t)/0.18));
      });
      document.getElementById('flash').style.opacity=flash;
    }
    // ---- conserto: C4 t 3.3 a 5.65 (T 6.05 a 8.4)
    const [cI,cF] = F.cons;
    const emConserto = T>=cI && T<cF;
    fase('conserto', emConserto);
    if(emConserto){
      const p=(T-cI)/(cF-cI);
      document.getElementById('engr').style.transform='rotate('+(p*720)+'deg)';
      document.querySelector('#barra i').style.width=(easeOut(p)*100)+'%';
      const pontos=Math.floor((T*3)%4); document.getElementById('txt').textContent='resolvendo'+'.'.repeat(pontos);
      document.getElementById('conserto').style.opacity = T<cI+0.2 ? (T-cI)/0.2 : (T>cF-0.2 ? (cF-T)/0.2 : 1);
    }
    // ---- resolvido (só nas cenas que têm)
    const emOk = !!F.ok && T>=F.ok[0] && T<F.ok[1];
    fase('ok', emOk);
    if(emOk){
      const [oI,oF]=F.ok;
      const p=easeBack((T-oI)/0.35);
      document.getElementById('circ').style.transform='scale('+p+')';
      document.querySelector('#ok span').style.opacity=easeOut((T-oI-0.2)/0.25);
      document.getElementById('ok').style.opacity = T>oF-0.25 ? (oF-T)/0.25 : 1;
    }
  };
  window.frame(0);
  if(!location.search.includes('parado')){ const t0=performance.now(); (function tick(){ window.frame(((performance.now()-t0)/1000)%(CENA==='c3'?5.2:8.2)); requestAnimationFrame(tick); })(); }
</script>
</body>
</html>
